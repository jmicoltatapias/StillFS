services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${STILLFS_DB_NAME:-stillfs}
      POSTGRES_USER: ${STILLFS_DB_USER:-stillfs}
      POSTGRES_PASSWORD: ${STILLFS_DB_PASSWORD:-stillfs-dev-password}
    volumes:
      - stillfs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  stillfs:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      STILLFS_HTTP_ADDR: ":9000"
      STILLFS_STORAGE_ROOT: /app/data/objects
      STILLFS_DB_HOST: postgres
      STILLFS_DB_PORT: "5432"
      STILLFS_DB_NAME: ${STILLFS_DB_NAME:-stillfs}
      STILLFS_DB_USER: ${STILLFS_DB_USER:-stillfs}
      STILLFS_DB_PASSWORD: ${STILLFS_DB_PASSWORD:-stillfs-dev-password}
      STILLFS_DB_SSLMODE: disable
      STILLFS_DB_MAX_OPEN_CONNS: "10"
      STILLFS_DB_MAX_IDLE_CONNS: "5"
      STILLFS_CREDENTIAL_ENCRYPTION_KEY: ${STILLFS_CREDENTIAL_ENCRYPTION_KEY:?Set a persistent base64-encoded 32-byte encryption key in .env}
      STILLFS_S3_REGION: ${STILLFS_S3_REGION:-us-east-1}
      STILLFS_S3_CLOCK_SKEW: ${STILLFS_S3_CLOCK_SKEW:-5m}
      STILLFS_MAX_OBJECT_BYTES: ${STILLFS_MAX_OBJECT_BYTES:-5368709120}
      STILLFS_MAX_HEADER_BYTES: ${STILLFS_MAX_HEADER_BYTES:-1048576}
      STILLFS_MAX_METADATA_BYTES: ${STILLFS_MAX_METADATA_BYTES:-8192}
    ports:
      - "${STILLFS_HTTP_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    volumes:
      - stillfs-objects:/app/data/objects

volumes:
  stillfs-postgres:
  stillfs-objects:
